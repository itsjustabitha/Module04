<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Lab 6 - Fetch Data</title>
</head>

<body>

    <!-- Post card template -->
    <template id="post-template">
        <div class="col">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title"></h5>
                    <p class="card-text"></p>
                </div>
            </div>
        </div>
    </template>

    <div class="container mt-4">
        <h1>Bootstrap Cards</h1>
        <div id="post-list" class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4"></div>
    </div>

    <script>
        // 1 — Function to add one post card to the page
        function addCard(post) {
            const template =
                document.getElementById("post-template")
                    .content.cloneNode(true);

            template.querySelector('.card-title').innerText = post.title;
            template.querySelector('.card-text').innerText = post.body;

            document.querySelector('#post-list')
                .appendChild(template);
        }

        // 2 — Fetch posts from JSON Placeholder
        // Default limit is 10
        fetch('https://jsonplaceholder.typicode.com/posts?_limit=10')
            .then(response => response.json())
            .then(posts => {
                console.log(posts);
                posts.forEach(post => addCard(post));
            });

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
