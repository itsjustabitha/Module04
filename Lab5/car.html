<!DOCTYPE html>
<html lang="en">
<template id="car-template">
    <div class="card col-8" style="width: 18rem; margin:10px">
        <div class="card-body">
            <h5 class="card-title">Car title</h5>
            <p class="card-text">Car text.</p>
        </div>
    </div>
</template>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>News Feed</title>
</head>

<body>

    <!-- News item template -->
    <template id="news-template">
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title"></h5>
                <p class="card-text"></p>
            </div>
        </div>
    </template>

    <div class="container mt-4">
        <h1>Latest News</h1>
        <div id="news-list"></div>
    </div>

    <script>
        // 1 — News data array
        let news = [
            {
                id: 1, title: 'Election Results',
                content: "Newly elected minister..."
            },
            {
                id: 2, title: 'Sporting Success',
                content: "World Cup winners..."
            },
            {
                id: 3, title: 'Tornado Warning',
                content: "Residents should prepare..."
            }
        ];

        // 2 — Function to add one news card
        function addNewsItem(item) {
            const template =
                document.getElementById("news-template")
                    .content.cloneNode(true);

            template.querySelector('.card-title').innerText = item.title;
            template.querySelector('.card-text').innerText = item.content;

            document.querySelector('#news-list')
                .appendChild(template);
        }

        // 3 — Function to clear and repopulate the news list
        function renderNews() {
            // Clear everything currently on screen
            document.querySelector('#news-list').innerHTML = '';

            // Repopulate from the array
            news.forEach(function (item) {
                console.log(item);
                addNewsItem(item);
            });
        }

        // // 4 — Run on page load
        // renderNews();

        // // 5 — Re-run every 5 seconds
        // setInterval(function () {
        //     console.log('Refreshing news...');
        //     renderNews();
        // }, 5000);

        // 4 — Add new item to the array from form inputs
        function addNewsToArray() {
            // Grab input values
            const title = document.getElementById('news-title').value;
            const content = document.getElementById('news-content').value;

            // Stop if fields are empty
            if (!title || !content) {
                alert('Please fill in both fields.');
                return;
            }

            // Push new item into array
            news.push({
                id: news.length + 1,
                title: title,
                content: content
            });

            // Clear the input fields
            document.getElementById('news-title').value = '';
            document.getElementById('news-content').value = '';

            console.log('News array updated:', news);

            // Immediately refresh the screen
            renderNews();
        }

        // 5 — Run on page load
        renderNews();

        // 6 — Re-run every 5 seconds
        const interval = setInterval(function() {
            console.log('Refreshing news...');
            renderNews();
        }, 5000);

        // 7 — Extension: Stop the interval
        function stopInterval() {
            clearInterval(interval);
            console.log('Auto-refresh stopped.');
            alert('Auto-refresh has been stopped.');
        }


    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>`
