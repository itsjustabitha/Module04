        // 1 — Artist data
        const artists = [
            {
                name: "Van Gogh",

        ];

        // 2 — Function to display artist name
        function addArtist(name) {
            const template =
                document.getElementById("artist-template")
                    .content.cloneNode(true);

            template.querySelector('.artist-name').innerText = name;

            document.querySelector('#artist-profile')
                .appendChild(template);
        }

        // 3 — Function to add one portfolio card
        function addCard(title, url) {
            const template =
                document.getElementById("card-template")
                    .content.cloneNode(true);

            template.querySelector('.card-title').innerText = title;
            template.querySelector('.card-image').src = url;
            template.querySelector('.card-image').alt = title;

            document.querySelector('#card-list')
                .appendChild(template);
        }

        // 4 — Generate artist name
        artists.forEach(function(artist) {
            addArtist(artist.name);
